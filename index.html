<!doctype html>
<html lang="en">
<title>Practice Kitty</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Practice Kitty">
<meta name="theme-color" content="#DEEAF1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FAF6F0; --bg2:#F1EAE0; --card:#FFFFFF; --ink:#332E29; --muted:#8B8175; --line:#EAE1D4;
  --felt:#E4677E; --felt-dark:#C74E64; --teal:#3FA98C; --teal-soft:#E4F2EC;
  --gold:#EFB54B; --gold-soft:#FBF0DA;
  --fur:#4E4757; --fur-dark:#3B3543; --fur-light:#847A96; --pink:#F4B8C4; --pink-soft:#FBE7EB;
  --sky:#A8CFEA; --plum:#A98FD6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gut:16px}
@media (min-width:700px){:root{--gut:24px}}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.app{height:100dvh}
button,.task,.care,.item{touch-action:manipulation}
.top{padding-top:calc(10px + env(safe-area-inset-top,0px))!important}
body{margin:0;background:linear-gradient(180deg,#DEEAF1 0px,#E4EDF2 160px,#FBF8F3 400px,#F5EDE2);color:var(--ink);font:17px/1.4 "Nunito",ui-rounded,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
h1,h2,h3,.display{font-family:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
.app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px}
.kids{display:flex;gap:8px;flex-wrap:wrap}
.kidchip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:700}
.kidchip[aria-pressed="true"]{border-color:var(--ink)}
.kidchip .dot{width:26px;height:26px;border-radius:50%}
.wallet{display:flex;gap:8px}
.coin{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);padding:5px 11px;border-radius:99px;font-weight:700;font-variant-numeric:tabular-nums}
.coin svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;padding:0 var(--gut) 20px}
.tabs{display:flex;justify-content:space-around;flex:none;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:.82rem;color:var(--muted);padding:5px 18px;border-radius:13px}
.tab svg{width:30px;height:30px}
.tab[aria-selected="true"]{color:var(--felt);background:var(--pink-soft)}
.screen{display:flex;flex-direction:column;gap:16px}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;position:relative;
  background:linear-gradient(180deg,#DEEAF1 0%,#EEF4F6 46%,#F2E8D8 46%,#EBDFCB 100%);
  margin-inline:calc(var(--gut) * -1);
  border-radius:0 0 34px 34px;padding:14px 14px 34px;min-height:min(44vh,400px);overflow:hidden}
.sheet{background:var(--card);border-radius:28px 28px 0 0;margin:-26px calc(var(--gut) * -1) 0;padding:18px var(--gut) 8px;
  box-shadow:0 -10px 30px rgba(90,70,45,.08);position:relative;z-index:3;display:flex;flex-direction:column;gap:14px;flex:1}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto}
.sheettitle{font-size:1.05rem;color:var(--ink)}
.deco{position:absolute;pointer-events:none}
.deco.win{top:14px;left:14px;width:76px}
.deco.plant{bottom:6px;right:10px;width:64px}
.deco.piano{bottom:8px;left:8px;width:92px}
.rug{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:62%;height:34px;border-radius:50%;background:radial-gradient(closest-side,#EBD6C6,#E3C8B4 70%,transparent 72%);opacity:.8}
.stage .kitty,.stage .speech,.stage .listening{position:relative;z-index:2}
.daybar{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.88rem}
.daybar .meter{flex:1;height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
.daybar .meter i{display:block;height:100%;border-radius:99px;background:var(--teal);transition:width .5s}
.daybar span{white-space:nowrap;color:var(--muted)}
.kitty{width:min(62vw,300px);height:auto;max-width:100%;touch-action:manipulation}
.speech{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px 18px;font-weight:700;font-size:1.08rem;text-align:center;max-width:34ch;position:relative;box-shadow:0 4px 14px rgba(70,55,35,.08)}
.speech::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--card);border-bottom:0}
.streak{display:flex;gap:6px;justify-content:center}
.streak span{width:26px;height:26px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--muted)}
.streak span.on{background:var(--gold);color:#fff}
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:14px;background:none;border:0;border-bottom:1px solid var(--bg2);border-radius:0;padding:13px 2px;text-align:left;min-height:70px;width:100%}
.tasks .task:last-child{border-bottom:0}
.task:active{background:var(--bg)}
.tinfo{flex:1;min-width:0}
.tstat{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;background:var(--bg2);color:var(--muted);font-variant-numeric:tabular-nums}
.tstat.full{background:var(--teal);color:#fff}
.tstat svg{width:22px;height:22px}
.task .ic{width:50px;height:50px;border-radius:50%;background:var(--teal-soft);display:grid;place-items:center;flex:none}
.task .ic svg{width:34px;height:34px}
.task b{font-family:"Fredoka",sans-serif;font-size:1.15rem;font-weight:600;display:block;line-height:1.15}
.task small{color:var(--muted);font-weight:700}
.task.done{opacity:.72}
.task.done .ic{background:var(--teal);color:#fff}
.pips{display:flex;gap:5px;margin-top:6px}
.pips i{width:14px;height:14px;border-radius:50%;background:var(--bg2)}
.pips i.on{background:var(--gold)}
.bigbtn{background:var(--felt);color:#fff;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.35rem;padding:14px 36px;border-radius:99px;box-shadow:0 8px 20px rgba(199,78,100,.32)}
.bigbtn:active{transform:scale(.97)}
.bigbtn:disabled{opacity:.45}
.btn{background:var(--card);border:1.5px solid var(--line);font-weight:700;padding:10px 16px;border-radius:13px}
.btn.primary{background:var(--felt);border-color:var(--felt);color:#fff}
.btn.danger{color:#B23A48}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.sim{border:2px dashed var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;background:rgba(255,255,255,.45)}
.sim p{margin:0;font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.back{align-self:flex-start;font-weight:800;color:var(--felt);padding:6px 0}
.listening{display:inline-flex;align-items:center;gap:8px;background:var(--felt);color:#fff;border-radius:99px;padding:6px 14px;font-weight:800;font-size:.9rem}
.listening i{width:10px;height:10px;border-radius:50%;background:#FFE07A;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.careRow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px}
.care{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;box-shadow:0 2px 12px rgba(70,55,35,.05)}
.care svg{width:40px;height:40px}
.care small{color:var(--muted);font-weight:700;font-size:.78rem}
.closet{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;font-weight:800;font-size:.9rem}
.item svg{width:64px;height:48px}
.item[aria-pressed="true"]{border:2px solid var(--gold)}
.item .price{display:flex;align-items:center;gap:3px;color:var(--muted);font-size:.8rem}
.item .price svg{width:16px;height:16px}
.item.locked{opacity:.6}
h2{font-size:1.6rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:1.2rem}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:"Fredoka",sans-serif;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.log{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.log li{display:flex;gap:10px;align-items:baseline;font-size:.95rem}
.log time{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;min-width:4.2em}
.flag{display:inline-block;background:var(--pink-soft);color:#A33A4C;border-radius:8px;padding:0 7px;font-weight:800;font-size:.8rem}
.edit{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.edit:first-of-type{border-top:0}
input[type=text],select{font:inherit;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;min-width:0;width:100%}
.stepper{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--bg);font-weight:800;font-size:1.2rem}
.focusline{grid-column:1/-1;display:flex;gap:8px}
.worksheet{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.worksheet img{width:120px;height:90px;object-fit:cover;border-radius:12px;border:2px solid var(--line)}
.wsph{width:120px;height:90px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:.8rem;text-align:center;padding:6px}
.gate{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:30px;text-align:center}
.gate .q{font-family:"Fredoka",sans-serif;font-size:2.2rem}
.demo{font-size:.78rem;background:var(--gold-soft);color:#7A5A12;border-radius:8px;padding:2px 8px;font-weight:800}
.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.heart{position:absolute;width:28px;height:28px;animation:float 1.4s ease-out forwards}
@keyframes float{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-140px) scale(1.2);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
.kbody{transform-origin:100px 170px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02,.985)}}
.ktail{transform-origin:140px 160px;animation:wag 2.4s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
.kears{transition:transform .3s}

.notes{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.nchip{font:600 .78rem "Fredoka",sans-serif;background:var(--teal-soft);color:#2B7A63;border-radius:8px;padding:2px 7px;min-width:26px;text-align:center}
.nchip.long{padding-inline:12px}
.nchip.short{background:#EEF6F2;font-size:.7rem}
.notesbar{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notesbar .muted{font-size:.85rem}
.editor{grid-column:1/-1;background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.editor .keys{display:flex;gap:6px;flex-wrap:wrap}
.editor .keys button{min-width:44px;height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font:600 1rem "Fredoka",sans-serif}
.editor .beats button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.status{font-size:.85rem;color:var(--muted)}
.status.err{color:#B23A48}
.kb{width:100%;max-width:520px;margin:0 auto;display:block}
.kb .w{fill:#fff;stroke:#D9CFC2;stroke-width:1.5}
.kb .b{fill:#3B3543}
.kb .lbl{font:600 13px "Fredoka",sans-serif;fill:#8B8175;text-anchor:middle}
.kb .next.w{fill:#FCE6B0}
.kb .next.b{fill:#E0A63A}
.kb .ok{fill:#BFE8D7!important}
.kb .bad{fill:#F7C1CB!important}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;scroll-behavior:smooth;max-width:100%}
.strip span{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 .82rem "Fredoka",sans-serif;background:var(--bg2);color:var(--muted)}
.strip span.cur{background:var(--gold);color:#fff;transform:scale(1.12)}
.strip span.ok{background:var(--teal);color:#fff}
.strip span.miss{background:#F7C1CB;color:#A33A4C}
.strip span.long{width:44px;border-radius:15px}
.strip span.short{width:24px;height:24px;font-size:.7rem}
.songmode .kitty{width:min(38vw,170px)!important}
.songmode .stage{min-height:0!important;padding-bottom:14px}
.songmode .deco{display:none}
.songmode h2{font-size:1.3rem}
.songmode{gap:10px!important}
.feedbtn{position:absolute;right:10px;bottom:40px;z-index:3;display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:8px 14px 8px 8px;font:600 .95rem "Fredoka",sans-serif;color:var(--ink);box-shadow:0 4px 14px rgba(70,55,35,.12);cursor:pointer}
.feedbtn svg{width:34px;height:34px}
.feedbtn:active{transform:scale(.97)}
.stage.hasfeed .deco.plant{display:none}
.chew .kbody{animation:chew .35s ease-in-out 6}
@keyframes chew{50%{transform:scale(1.04,.96) translateY(3px)}}
.task .ic img{width:50px;height:50px;object-fit:cover;border-radius:50%}
.task.new{background:var(--gold-soft)}
.sheetthumb{width:56px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.chew .kbody{animation:none}}
@media (prefers-reduced-motion:reduce){.kbody,.ktail,.listening i{animation:none}.heart{animation-duration:.01s}}
@media (min-width:700px){.kitty{width:290px}.top{padding-inline:24px}}
@media (max-width:430px){.kitty{width:min(58vw,230px)}.stage{min-height:0;padding-bottom:30px}.speech{font-size:1rem;max-width:28ch}.kidchip{padding:4px 10px 4px 4px;font-size:.92rem}.kidchip .dot{width:22px;height:22px}.coin{padding:4px 9px}.deco.piano{width:70px}.deco.win{width:58px}.deco.plant{width:48px}.feedbtn{bottom:38px;right:6px;font-size:.82rem;padding:6px 10px 6px 6px;gap:6px}.feedbtn svg{width:28px;height:28px}.streak span{width:22px;height:22px;font-size:.66rem}.task b{font-size:1.05rem}.careRow{gap:8px}}
</style>

<div class="app">
  <header class="top">
    <div class="kids" id="kids" role="group" aria-label="Who is practicing"></div>
    <div class="wallet" id="wallet"></div>
  </header>
  <main id="main"></main>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="practice"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="4" y="8" width="24" height="17" rx="3"/><path d="M10 8v11M16 8v11M22 8v11" /><rect x="8.5" y="8" width="3" height="7" fill="currentColor"/><rect x="20.5" y="8" width="3" height="7" fill="currentColor"/></svg>Practice</button>
    <button class="tab" role="tab" data-tab="kitty"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M7 6l4 6h10l4-6 1 12a10 9 0 0 1-20 0z"/><circle cx="12.5" cy="17" r="1.3" fill="currentColor"/><circle cx="19.5" cy="17" r="1.3" fill="currentColor"/></svg>Kitty</button>
    <button class="tab" role="tab" data-tab="parent"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="7" y="14" width="18" height="13" rx="3"/><path d="M11 14v-3a5 5 0 0 1 10 0v3"/></svg>Grown-ups</button>
  </nav>
</div>
<div class="confetti" id="confetti" hidden></div>

<script>
/* ---------- icons ---------- */
const FISH='<svg viewBox="0 0 24 24"><path d="M3 12c3-5 9-6 13-2l4-3v10l-4-3c-4 4-10 3-13-2z" fill="#7FB7E6"/><circle cx="8" cy="11" r="1.3" fill="#22302A"/></svg>';
const STAR='<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="#FFB94A"/></svg>';
const NOTE='<svg viewBox="0 0 24 24" fill="#3FB58F"><path d="M9 17.5a3 3 0 1 1-2-2.8V4l11-2v12.5a3 3 0 1 1-2-2.8V6.2L9 7.5z"/></svg>';
const SCALE='<svg viewBox="0 0 24 24" fill="#3FB58F"><rect x="2" y="16" width="4" height="5" rx="1"/><rect x="7" y="12" width="4" height="9" rx="1"/><rect x="12" y="8" width="4" height="13" rx="1"/><rect x="17" y="4" width="4" height="17" rx="1"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#F07C8E"/></svg>';
const SHEETBOWL='<svg viewBox="0 0 48 48"><path d="M10 8h22l6 6v20H10z" fill="#FFF8EC" stroke="#D9CFC2" stroke-width="2"/><path d="M14 16h16M14 21h16M14 26h16" stroke="#B8AC9C" stroke-width="1.6"/><path d="M25 18a3 3 0 1 1-2-2.8V12l6-1v3.2" fill="#4E4757"/><path d="M4 30h40a20 12 0 0 1-40 0z" fill="#A98FD6"/><path d="M6 30h36" stroke="#8F73C4" stroke-width="3"/></svg>';
const HAND='<svg viewBox="0 0 48 48"><path d="M14 26V12a3 3 0 0 1 6 0v10V8a3 3 0 0 1 6 0v14V10a3 3 0 0 1 6 0v14-8a3 3 0 0 1 6 0v14c0 8-6 14-13 14-5 0-8-2-11-6l-7-9a3 3 0 0 1 5-3z" fill="#FFD9B0" stroke="#D9803A" stroke-width="2"/></svg>';
const BOWL='<svg viewBox="0 0 48 48"><path d="M6 24h36a18 12 0 0 1-36 0z" fill="#9A6FD0"/><path d="M14 22c2-4 7-5 10-2l3-2v7l-3-2c-3 3-8 2-10-1z" fill="#7FB7E6"/></svg>';
const SHIRT='<svg viewBox="0 0 48 48"><path d="M16 8l-10 6 4 8 5-3v21h18V19l5 3 4-8-10-6c-1 3-4 5-8 5s-7-2-8-5z" fill="#F07C8E"/></svg>';
const FOCI={right:'Right hand',left:'Left hand',both:'Both hands',slow:'Nice and slow',loud:'Soft and loud'};

/* ---------- kitty accessories ---------- */
const ITEMS=[
  {id:'bow',name:'Pink bow',cost:1,svg:'<g transform="translate(134 50) rotate(18)"><path d="M0 0C-6-12-20-14-22-6c-2 8 12 10 22 6zM0 0c6-12 20-14 22-6 2 8-12 10-22 6z" fill="#FF8BA0"/><circle r="6" fill="#E85D7E"/></g>'},
  {id:'glasses',name:'Round glasses',cost:2,svg:'<g fill="none" stroke="#E8A33D" stroke-width="4"><circle cx="78" cy="90" r="16"/><circle cx="122" cy="90" r="16"/><path d="M94 90h12"/></g>'},

const C4=60,D4=62,E4=64,F4=65,G4=67,A4=69,B4=71,C5=72;
const SONGS={
  twinkle:{name:'Twinkle Twinkle',notes:[[C4,1],[C4,1],[G4,1],[G4,1],[A4,1],[A4,1],[G4,2],[F4,1],[F4,1],[E4,1],[E4,1],[D4,1],[D4,1],[C4,2]]},
  hotcross:{name:'Hot Cross Buns',notes:[[E4,1],[D4,1],[C4,2],[E4,1],[D4,1],[C4,2],[C4,.5],[C4,.5],[C4,.5],[C4,.5],[D4,.5],[D4,.5],[D4,.5],[D4,.5],[E4,1],[D4,1],[C4,2]]},
  mary:{name:'Mary Had a Little Lamb',notes:[[E4,1],[D4,1],[C4,1],[D4,1],[E4,1],[E4,1],[E4,2],[D4,1],[D4,1],[D4,2],[E4,1],[G4,1],[G4,2],[E4,1],[D4,1],[C4,1],[D4,1],[E4,1],[E4,1],[E4,1],[E4,1],[D4,1],[D4,1],[E4,1],[D4,1],[C4,4]]},
  cscale:{name:'C major scale',notes:[[C4,1],[D4,1],[E4,1],[F4,1],[G4,1],[A4,1],[B4,1],[C5,1],[B4,1],[A4,1],[G4,1],[F4,1],[E4,1],[D4,1],[C4,2]]},
};
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nn=m=>NOTE_NAMES[((m%12)+12)%12];
function songFor(t){
  if(!t)return null;
  if(t.notes&&t.notes.length)return {name:t.name,notes:t.notes};
  if(t.song&&SONGS[t.song])return SONGS[t.song];
  return null;
}
const NAME2PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function parsePitch(p){
  const m=/^\s*([A-Ga-g])\s*([#b♯♭]?)\s*(-?\d)?\s*$/.exec(p||'');
  if(!m)return null;
  let pc=NAME2PC[m[1].toUpperCase()];
  if(m[2]==='#'||m[2]==='♯')pc++;if(m[2]==='b'||m[2]==='♭')pc--;
  const oct=m[3]!==undefined?+m[3]:4;
  return 12*(oct+1)+pc;
}
const pname=m=>nn(m)+(Math.floor(m/12)-1);

let VOICE=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));
    const wish=['Samantha','Karen','Moira','Tessa','Martha','Google US English','Jenny','Aria','Zira','Female'];
    for(const w of wish){const v=vs.find(x=>x.name.includes(w));if(v){VOICE=v;return}}
    VOICE=vs[0]||null;
  }catch(e){}
}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function speak(txt){
  if(!S.sound)return;
  try{
    const clean=txt.replace(/♩≈\d+[^)]*\)?/g,'').replace(/\(aim \d+\)/g,'');
    const u=new SpeechSynthesisUtterance(clean);
    if(!VOICE)pickVoice();
    if(VOICE)u.voice=VOICE;
    u.rate=.9;u.pitch=1.5;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- read notes from the sheet photo with Claude ---------- */
let SDK=null;
// Sends only the sheet photo to Claude; returns {found,title,notes:[[midi,beats],...]}
async function transcribeSheet(dataUrl,{name,hand}={}){
  if(!SDK)SDK=(await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm')).default;
  const client=new SDK({apiKey:S.apiKey,dangerouslyAllowBrowser:true});
  const data=dataUrl.split(',')[1];
  const which=name?`Find the piece called "${name}" (if the page has only one piece, use it).`:'Pick the main piece on the page (the first one if there are several) and give its title exactly as printed; if there is no printed title, give a short name from the first words of the lyrics or "Untitled".';
  const part=hand==='left'?'the left-hand (bass clef) part':'the melody (right hand, treble clef)';
  const res=await client.beta.messages.create({
    model:'claude-opus-5',
    max_tokens:16000,
    betas:['server-side-fallback-2026-07-01'],
    fallbacks:'default',
    output_config:{format:{type:'json_schema',schema:{
      type:'object',additionalProperties:false,required:['found','title','notes'],
      properties:{
        found:{type:'boolean'},
        title:{type:'string'},
        notes:{type:'array',items:{type:'object',additionalProperties:false,required:['pitch','beats'],
          properties:{pitch:{type:'string'},beats:{type:'number'}}}}
      }}}},
    messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data}},
      {type:'text',text:`This is a photo of a beginner piano lesson page. ${which} Transcribe ${part} as an ordered list of single notes. For each note give the pitch in scientific notation (middle C is C4, sharps as C#4, flats as Bb4) and its length in beats (quarter note = 1, half = 2, whole = 4, eighth = 0.5). Where two notes sound together, give only the top melody note. Skip rests. Follow repeat signs by writing the repeated notes out. If you cannot find or read the piece, set found to false and return an empty list.`}
    ]}]
  });
  if(res.stop_reason==='refusal')return {found:false,title:'',notes:[],refused:true};
  const out=JSON.parse(res.content.filter(b=>b.type==='text').map(b=>b.text).join(''));
  const notes=(out.notes||[]).map(n=>[parsePitch(n.pitch),Math.max(.25,Math.min(8,+n.beats||1))]).filter(n=>n[0]!==null);
  return {found:!!out.found&&notes.length>0,title:(out.title||'').trim(),notes};
}
function readErrorMsg(e){
  const st=e&&e.status;
  return st===401?'That API key was not accepted. Check it under Sheet reading.':st===429?'Too many requests right now. Try again in a minute.':'Could not reach the sheet reader. Check your internet and try again.';
}
// Shrink a photo for storage and reading (long side ~1600px keeps note heads legible)
function loadPhoto(file){
  return new Promise((res,rej)=>{
    const img=new Image(),r=new FileReader();
    r.onerror=rej;img.onerror=rej;
    r.onload=()=>{img.onload=()=>{const c=document.createElement('canvas'),sc=Math.min(1,1600/Math.max(img.width,img.height));c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};img.src=r.result};
    r.readAsDataURL(file);
  });
}
// The kid (or parent) feeds the kitty a sheet: the song appears in today's list, notes read if a key is set
async function feedKitty(file){
  const k=kid();
  let sheet;
  try{sheet=await loadPhoto(file)}catch(e){say("Hmm, I couldn't see that picture. Try again?");render();return}
  const t={id:'t'+Date.now(),name:'New song',sheet,times:3,focus:'right',done:0,stuck:0,notes:[]};
  k.tasks.unshift(t);S.sample=false;save();
  view.newTask=t.id;view.chew=true;say('Nom nom nom… reading your music!','happy');render();
  setTimeout(()=>{view.chew=false},2200);
  if(!S.apiKey){
    say("Yum! I'll listen to your rhythm. Ask a grown-up for my reading glasses so I can check your notes too!");
    view.readStatus={id:t.id,msg:'Add your API key under Sheet reading, then tap "Read notes again".',err:true};
    render();return;
  }
  try{
    const out=await transcribeSheet(sheet,{hand:t.focus});
    if(out.title)t.name=out.title;

    else{save();say(out.refused?"I couldn't read that page. Try a clearer photo?":`I ate the sheet but couldn't read the notes. Try a straighter, brighter photo, or a grown-up can type them in.`)}
  }catch(e){say("Oops, my glasses fogged up. Check the internet and try again?");view.readStatus={id:t.id,msg:readErrorMsg(e),err:true}}

}
async function readSheet(t,k){
  if(!S.apiKey){view.readStatus={id:t.id,msg:'Add your API key under Sheet reading first.',err:true};render();return}
  view.readStatus={id:t.id,msg:'Reading the sheet…'};render();
  try{
    const out=await transcribeSheet(t.sheet||k.worksheet,{name:t.name==='New song'?'':t.name,hand:t.focus});
    if(!out.found){view.readStatus={id:t.id,msg:out.refused?'Could not read this sheet. Try a clearer photo or enter the notes by hand.':`Couldn't find "${t.name}" on the sheet. Check the song name matches, or enter the notes by hand.`,err:true};render();return}
    if(t.name==='New song'&&out.title)t.name=out.title;
    t.notes=out.notes;delete t.song;save();
    view.readStatus={id:t.id,msg:`Found ${out.notes.length} notes. Please check them against the sheet.`};
    view.editing=t.id;render();
  }catch(e){view.readStatus={id:t.id,err:true,msg:readErrorMsg(e)};render()}
}

function finishRun(kind,info={}){

  if(kind==='notes'){k.log.unshift({t:now(),text:`${t.name}, stuck on notes (${info.wrong} wrong notes), trying again`});t.stuck++;say(`${info.wrong} oopsie notes! Watch the yellow key and play it again, slowly.`)}
  if(kind==='good'){t.done++;k.log.unshift({t:now(),text:`${t.name}, run-through ${t.done} of ${t.times}${detail}`});
    if(t.done>=t.times){k.fish++;say(`Yippee, you did it! You won a fishy for me!`,'happy');confetti();
      if(k.tasks.every(x=>x.done>=x.times)){k.stars++;k.streak[(new Date().getDay()+6)%7]=1;setTimeout(()=>{say('Hooray! All your songs are done! You get a shiny star!','happy');render()},1800)}}
    else say(`Purr-fect! That's ${t.done} of ${t.times}! Again, again!`,'happy')}
  if(kind==='fast'){k.log.unshift({t:now(),text:`${t.name}, wobbly beat, trying again`});say('Whoa, wobbly paws! Let\'s play it again, slooow and steady like a sleepy kitty.')}
  if(kind==='stuck'){t.stuck++;k.log.unshift({t:now(),text:`${t.name}, stuck in the middle, restarted`});say('Ooh, a tricky bit! Play just that part three times, teeny tiny slow.')}
  if(t.done>=t.times)micStop();
  save();render();
}

/* ---------- pitch detection (YIN) + score following ---------- */
let TD=null;
function detectPitch(an,sr){
  if(!TD||TD.length!==an.fftSize)TD=new Float32Array(an.fftSize);
  an.getFloatTimeDomainData(TD);
  const n=TD.length;let rms=0;for(let i=0;i<n;i++)rms+=TD[i]*TD[i];rms=Math.sqrt(rms/n);
  if(rms<0.006)return null;
  const minLag=Math.floor(sr/1100),maxLag=Math.min(Math.floor(sr/75),n>>1),W=n-maxLag;
  const d=new Float32Array(maxLag+1);
  for(let tau=1;tau<=maxLag;tau++){let sum=0;for(let j=0;j<W;j++){const x=TD[j]-TD[j+tau];sum+=x*x}d[tau]=sum}
  let run=0;const c=new Float32Array(maxLag+1);c[0]=1;
  for(let tau=1;tau<=maxLag;tau++){run+=d[tau];c[tau]=run?d[tau]*tau/run:1}
  let tau=-1;
  for(let i=minLag;i<=maxLag;i++){if(c[i]<0.15){while(i+1<=maxLag&&c[i+1]<c[i])i++;tau=i;break}}
  if(tau<0){let best=1,bi=-1;for(let i=minLag;i<=maxLag;i++)if(c[i]<best){best=c[i];bi=i}if(best>0.3)return null;tau=bi}
  const a=c[tau-1]||c[tau],b=c[tau],cc=c[tau+1]||c[tau];
  const den=a+cc-2*b;const shift=den?(a-cc)/(2*den):0;
  const f=sr/(tau+shift);
  return {midi:Math.round(69+12*Math.log2(f/440)),conf:1-b,f};
}
const S2={on:false,song:null,idx:0,marks:[],times:[],wrong:0,lastWrongAt:0,lastWrongPc:-1,rhythmOff:0,lastRhythmSay:0,pend:null};
function songStart(sg){Object.assign(S2,{on:!!sg,song:sg,idx:0,marks:sg?sg.notes.map(()=>''):[],times:[],wrong:0,lastWrongAt:0,lastWrongPc:-1,rhythmOff:0,lastRhythmSay:0,pend:null})}
function pcEq(a,b){return ((a-b)%12+12)%12===0}
function songNote(midi,t,str=9){
  if(!S2.on||S2.idx>=S2.song.notes.length)return;
  const exp=S2.song.notes[S2.idx][0];
  flashKey(midi,pcEq(midi,exp)?'ok':'bad');
  if(pcEq(midi,exp)){
    if(S2.hold){clearTimeout(S2.hold.timer);S2.hold=null}
    S2.marks[S2.idx]='ok';S2.times[S2.idx]=t;
    // rhythm vs the song's own note lengths at the kid's own speed
    const i=S2.idx;
    if(i>=1&&S2.times[i-1]){
      const ratios=[];for(let j=1;j<=i;j++)if(S2.times[j]&&S2.times[j-1])ratios.push((S2.times[j]-S2.times[j-1])/1000/S2.song.notes[j-1][1]);
      if(ratios.length>=3){
        const sorted=ratios.slice().sort((x,y)=>x-y),beat=sorted[sorted.length>>1];
        const r=ratios[ratios.length-1]/beat;
        if(r<0.55||r>1.8){S2.rhythmOff++;
          if(t-S2.lastRhythmSay>6000&&t-S2.lastWrongAt>2500){S2.lastRhythmSay=t;
            const prevBeats=S2.song.notes[i-1][1];
            liveSay(r<0.55?(prevBeats>=2?'Hold the long notes longer, count 1, 2!':'Whoa, speedy! Slow and steady.'):'Keep going, don\'t stop! Try to play smooth.')}}
      }
    }
    S2.idx++;
  }else if(S2.idx+1<S2.song.notes.length&&pcEq(midi,S2.song.notes[S2.idx+1][0])&&S2.idx>0){
    // skipped one note: accept and move on
    S2.marks[S2.idx]='miss';S2.marks[S2.idx+1]='ok';S2.times[S2.idx+1]=t;S2.idx+=2;S2.wrong++;
  }else{
    const pc=((midi%12)+12)%12;
    if(pc===S2.lastWrongPc&&t-S2.lastWrongAt<700)return;
    const prev=S2.idx>0?S2.song.notes[S2.idx-1][0]:null;
    if(prev!==null&&pcEq(midi,prev)&&S2.times[S2.idx-1]){
      const io=[];for(let j=1;j<S2.idx;j++)if(S2.times[j]&&S2.times[j-1])io.push(S2.times[j]-S2.times[j-1]);
      io.sort((a,b)=>a-b);const med=io.length?io[io.length>>1]:700;
      if(t-S2.times[S2.idx-1]<Math.max(180,med*0.45))return;
      // could be the previous key still ringing: only count it if the right note doesn't follow right away
      clearTimeout(S2.hold&&S2.hold.timer);
      const idxAt=S2.idx;
      S2.hold={t,timer:setTimeout(()=>{S2.hold=null;if(S2.on&&S2.idx===idxAt)commitWrong(midi,t)},Math.max(330,med*0.75))};
      return;
    }
    commitWrong(midi,t);return;
  }
  drawSongUI();
  if(S2.idx>=S2.song.notes.length)setTimeout(songEnd,350);
}
function commitWrong(midi,t){
  const exp=S2.song.notes[S2.idx][0];
  S2.wrong++;S2.lastWrongPc=((midi%12)+12)%12;
  if(t-S2.lastWrongAt>2500)liveSay(`Oops! That was ${nn(midi)}. Try ${nn(exp)}!`);
  S2.lastWrongAt=t;S2.marks[S2.idx]=S2.marks[S2.idx]||'bad';
  drawSongUI();
}
function songEnd(){
  if(!S2.on)return;
  const n=S2.song.notes.length,wrong=S2.wrong,rOff=S2.rhythmOff;
  const mins=mic.playSec/60;
  songStart(S2.song);micReset();
  let kind='good';
  if(wrong>Math.max(2,Math.round(n*0.15)))kind='notes';
  else if(rOff>Math.max(2,Math.round(n*0.2)))kind='fast';
  finishRun(kind,{minutes:Math.max(1,Math.round(mins)),wrong,rOff,n});
}
function flashKey(midi,cls){

}

/* ---------- real listening (Web Audio) ---------- */
const mic={on:false,err:null,raf:0,ctx:null,an:null,stream:null,
  noise:1e-4,onsets:[],playSec:0,lastTick:0,lastLevel:0,quietSince:0,stumbles:0,
  lastFb:0,fbIdx:0,shortNudged:false};
function micReset(){mic.onsets=[];mic.playSec=0;mic.quietSince=0;mic.stumbles=0;mic.lastLevel=0;mic.lastFb=0;mic.shortNudged=false}
async function micStart(){
  micReset();mic.err=null;mic.maxLevel=0;mic.startT=performance.now();mic.heard=false;mic.silentChecked=false;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){mic.err=window.top!==window?'preview':(location.protocol==='https:'||location.hostname==='localhost')?'unsupported':'insecure';return false}
  try{
    // Safari only lets audio start inside the tap itself, so make the context before asking for the mic
    mic.ctx=new (window.AudioContext||window.webkitAudioContext)();
    try{await mic.ctx.resume()}catch(e){}
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
    catch(e){if(e&&(e.name==='OverconstrainedError'||e.name==='NotReadableError')){stream=await navigator.mediaDevices.getUserMedia({audio:true})}else throw e}
    mic.stream=stream;
    if(mic.ctx.state!=='running'){try{await mic.ctx.resume()}catch(e){}}
    const src=mic.ctx.createMediaStreamSource(mic.stream);
    const lo=mic.ctx.createBiquadFilter();lo.type='highpass';lo.frequency.value=55;
    const hi=mic.ctx.createBiquadFilter();hi.type='lowpass';hi.frequency.value=4500;
    mic.an=mic.ctx.createAnalyser();mic.an.fftSize=2048;mic.an.smoothingTimeConstant=.25;
    src.connect(lo);lo.connect(hi);hi.connect(mic.an);
    mic.on=true;mic.lastTick=performance.now();micLoop();
    return true;
  }catch(e){mic.err=e&&e.name||'denied';mic.errMsg=e&&e.message?String(e.message).slice(0,80):'';mic.on=false;try{mic.ctx&&mic.ctx.close()}catch(x){}mic.ctx=null;return false}
}
function micErrText(){
  const e=mic.err;
  if(e==='preview')return 'The microphone is blocked in this preview window, so use the pretend buttons below. Real ears work at the app link.';
  if(e==='insecure')return 'The microphone only works on the https app link. Open chephen.github.io/Practice-Kitty/ in Safari.';
  if(e==='unsupported')return 'This browser cannot use the microphone. Open the app link in Safari.';
  if(e==='NotAllowedError'||e==='SecurityError'||e==='denied')return 'The microphone is not allowed. Tap "Kitty, listen!" again and choose Allow. If no question appears, open Settings, Safari, Microphone, set it to Ask or Allow, then reopen the app.';
  if(e==='NotFoundError')return 'No microphone was found on this device.';
  if(e==='NotReadableError')return 'Another app is using the microphone. Close it and try again.';
  return 'The microphone did not start ('+e+'). Tap "Kitty, listen!" to try again.';
}
function micStop(){
  mic.on=false;cancelAnimationFrame(mic.raf);
  try{mic.stream&&mic.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{mic.ctx&&mic.ctx.close()}catch(e){}
  mic.ctx=mic.an=mic.stream=null;
}
// update the bubble in place while the kid plays, without a full re-render
function liveSay(txt){
  view.say=txt;
  const el=document.querySelector('.speech');
  if(el)el.textContent=txt;else render();
  speak(txt);
}
function rollCV(n){
  const o=mic.onsets.slice(-n),io=[];
  for(let i=1;i<o.length;i++){const d=(o[i]-o[i-1])/1000;if(d>=0.12&&d<=1.6)io.push(d)}
  if(io.length<5)return null;
  const m=io.reduce((a,b)=>a+b,0)/io.length;
  return Math.sqrt(io.reduce((a,b)=>a+(b-m)**2,0)/io.length)/m;
}
const FB_STEADY=["I hear you! Nice steady playing!","Ooh, that sounds lovely! Keep going!","My tail is swishing to your beat!"];
const FB_WOBBLY=["Let\'s find the beat together. Slow and steady!","Hmm, wobbly! Try counting one, two, three, four.","Slooow down a little, like a sleepy kitty walk."];
function ttsBusy(){try{return speechSynthesis.speaking}catch(e){return false}}
function micLoop(){
  if(!mic.on)return;
  mic.raf=requestAnimationFrame(micLoop);
  const buf=new Uint8Array(mic.an.frequencyBinCount);
  mic.an.getByteFrequencyData(buf);
  let sum=0;for(let i=2;i<buf.length*0.6;i++)sum+=buf[i];
  const level=sum/(buf.length*0.6)/255;
  const t=performance.now();
  const dt=(t-mic.lastTick)/1000;mic.lastTick=t;
  mic.noise=Math.min(mic.noise*(1+dt*0.05)+1e-6, Math.max(1e-4, mic.noise*(level<mic.noise*1.5?0.995:1)+level*0.002));
  const vu=document.getElementById('micvu');
  if(vu)vu.style.transform='scaleY('+Math.min(1,level*9).toFixed(2)+')';
  mic.maxLevel=Math.max(mic.maxLevel||0,level);
  if(!mic.heard&&!ttsBusy()&&level>0.03){mic.heard=true;const ms=document.getElementById('micstate');if(ms)ms.textContent='I can hear you!'}
  if(!mic.silentChecked&&t-mic.startT>8000){mic.silentChecked=true;if((mic.maxLevel||0)<0.006){const ms=document.getElementById('micstate');if(ms)ms.textContent='No sound is reaching my ears';liveSay("I can't hear anything at all. Is the microphone on?")}}
  // the kitty's own voice must not count as piano notes
  if(ttsBusy())mic.muteUntil=t+350;
  if(t<(mic.muteUntil||0)){mic.lastLevel=level;S2.pend=null;return}
  const active=level>Math.max(0.026,mic.noise*2.2);
  // spectral flux: new energy appearing across the spectrum = a key being struck (steadier than overall loudness)
  let flux=0;const lim=Math.floor(buf.length*0.6);
  if(mic.prevSpec){for(let i=2;i<lim;i++){const dlt=buf[i]-mic.prevSpec[i];if(dlt>0)flux+=dlt}flux/=(lim*255)}
  mic.prevSpec=buf;
  const fh=mic.fluxHist||(mic.fluxHist=[]);
  const avg=fh.length?fh.reduce((a,b)=>a+b,0)/fh.length:0;
  const thr=Math.max(0.018,avg*2.4);
  const isOnset=flux>thr&&(mic.lastFlux||0)<=thr;
  mic.lastFlux=flux;fh.push(flux);if(fh.length>45)fh.shift();
  // finish a pending pitch reading: skip the hammer attack, then take the median of a few frames
  if(S2.on&&S2.pend){
    // time-based, not frame-based: the analyser window (~43ms) must be clear of the previous note
    const age=t-S2.pend.t;
    if(age>=65&&t-(S2.pend.lastRead||0)>=12){S2.pend.lastRead=t;const p=detectPitch(mic.an,mic.ctx.sampleRate);if(p&&p.conf>0.8)S2.pend.vals.push(p.midi)}
    if(age>=150&&S2.pend.vals.length>=2||age>=260){const v=S2.pend.vals.sort((a,b)=>a-b);const pt=S2.pend.t,ps=S2.pend.str;S2.pend=null;if(v.length>=2)songNote(v[v.length>>1],pt,ps)}
  }
  if(active){
    mic.playSec+=dt;mic.quietSince=0;
    if(isOnset&&level>0.03){
      const last=mic.onsets[mic.onsets.length-1]||0;
      if(t-last>110){
        mic.onsets.push(t);
        if(S2.on){if(S2.pend&&S2.pend.vals.length>=2){const v=S2.pend.vals.sort((a,b)=>a-b);songNote(v[v.length>>1],S2.pend.t,S2.pend.str)}S2.pend={t,age:0,vals:[],str:level/Math.max(1e-4,mic.lastLevel)}}
      }
    }
    if(!S2.on){
      if(!mic.lastFb)mic.lastFb=t;
      if(t-mic.lastFb>9000&&mic.onsets.length>=8){
        mic.lastFb=t;
        const cv=rollCV(16);
        if(cv!==null){const pool=cv>0.55?FB_WOBBLY:FB_STEADY;liveSay(pool[(mic.fbIdx++)%pool.length])}
      }
    }
  }else if(mic.onsets.length){
    mic.quietSince+=dt;
    if(S2.on){
      // mid-song pause: encourage, but let them continue where they left off
      if(mic.quietSince>4&&mic.quietSince<4+dt+0.001&&S2.idx>0&&S2.idx<S2.song.notes.length)liveSay(`You're doing great! Next note is ${nn(S2.song.notes[S2.idx][0])}.`);
      if(mic.quietSince>15){mic.onsets=[]}
    }else{
      if(mic.quietSince>1.4&&mic.quietSince<1.5&&mic.onsets.length>=5){
        mic.stumbles++;
        if(mic.stumbles<=2)liveSay("Oops, tricky spot? Try just that bit, nice and slow!");
      }
      if(mic.quietSince>2.8&&mic.onsets.length>=6){micRunEnd();return}
      if(mic.quietSince>5&&mic.onsets.length>=3&&mic.onsets.length<6&&!mic.shortNudged){
        mic.shortNudged=true;
        liveSay("That was a tiny one! Play me the whole song!");
      }
      if(mic.quietSince>10&&mic.onsets.length<6){micReset()}
    }
  }
  mic.lastLevel=level*0.6+mic.lastLevel*0.4;
  const el=document.getElementById('micstate');
  if(el&&!S2.on)el.textContent=mic.onsets.length? '♪ '+mic.onsets.length+' notes heard':'Kitty ears are on…';
}
function micRunEnd(){
  const io=[];for(let i=1;i<mic.onsets.length;i++){const d=(mic.onsets[i]-mic.onsets[i-1])/1000;if(d>=0.12&&d<=1.6)io.push(d)}
  let kind='good';
  if(io.length>=5){
    const mean=io.reduce((a,b)=>a+b,0)/io.length;
    const sd=Math.sqrt(io.reduce((a,b)=>a+(b-mean)**2,0)/io.length);
    if(mic.stumbles>=2)kind='stuck';
    else if(sd/mean>0.55)kind='fast';
  }
  const mins=mic.playSec/60;
  micReset();
  finishRun(kind,{minutes:Math.max(1,Math.round(mins))});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const k=kid(),d=b.dataset;
  if(d.tab){micStop();view.tab=d.tab;view.task=null;view.sheet=false;view.say=null;view.mood=null;view.closet=false;render();return}
  if(d.kid){micStop();S.active=d.kid;view.task=null;view.say=null;view.mood=null;save();render();return}
  if(d.task){view.newTask=null;const t=k.tasks.find(x=>x.id===d.task);if(t.done>=t.times){say('You finished that one, superstar!','happy')}else{view.task=d.task;say(`Ready, set... play ${t.name}! ${FOCI[t.focus]}. My ears are up!`)}render();return}
  if(d.sim){finishRun(d.sim,{minutes:d.sim==='good'?2:1,wrong:d.sim==='notes'?4:0});return}
  if(d.act==='home'){micStop();view.task=null;view.sheet=false;view.say=null;view.mood=null;render();return}
  if(d.act==='earson'){songStart(songFor(k.tasks.find(x=>x.id===view.task)));say("My ears are up! Play your song, I'm listening!");render();micStart().then(ok=>{if(!ok){say(mic.err==='preview'||mic.err==='unsupported'?"Hmm, I can't hear in here. Use the pretend buttons for now!":"Hmm, my ears aren't working. Can a grown-up turn on the microphone?")}render()});return}
  if(d.act==='earsoff'){const enough=mic.onsets.length>=6;if(enough)micRunEnd();micStop();if(!enough)say('Okay, break time!');render();return}
  if(d.act==='showsheet'){view.sheet=true;render();return}
  if(d.act==='hidesheet'){view.sheet=false;render();return}
  if(d.act==='pet'){say(['Purrrr purrrr…','Hee hee, that tickles my whiskers!','More pets please, meow!'][Math.random()*3|0],'happy');render();hearts();return}
  if(d.act==='feed'){if(k.fish<1){say('No fishies yet! Play a song and you can feed me!')}else{k.fish--;k.fed++;say('Yum yum yum! Thank you, thank you!','happy');save()}render();if(k.fed)hearts(3);return}
  if(d.act==='closet'){view.closet=!view.closet;view.say=view.closet?'Ooh! Pick something pretty for me!':null;render();return}
  if(d.item){const it=ITEMS.find(i=>i.id===d.item);
    if(k.owned.includes(it.id)){k.wearing=k.wearing.includes(it.id)?k.wearing.filter(x=>x!==it.id):[...k.wearing,it.id];say(k.wearing.includes(it.id)?'Ta-da! Do I look fancy?':'Okey dokey, off it goes!','happy')}
    else if(k.stars>=it.cost){k.stars-=it.cost;k.owned.push(it.id);k.wearing.push(it.id);say(`A ${it.name.toLowerCase()}! I love love love it!`,'happy');confetti()}
    else say(`That one needs ${it.cost} stars. Finish all your songs to get stars!`);
    save();render();return}
  if(d.gate){if(+d.gate===view.gateQ.ans){view.gate=true}view.gateQ=null;render();return}
  if(d.act==='lock'){view.gate=false;render();return}
  if(d.read){const t=k.tasks.find(x=>x.id===d.read);if(t&&(t.sheet||k.worksheet))readSheet(t,k);return}
  if(d.editnotes){view.editing=view.editing===d.editnotes?null:d.editnotes;render();return}
  if(d.beat){view.edBeat=+d.beat;render();return}
  if(d.addnote){const t=k.tasks.find(x=>x.id===d.t);const cur=songFor(t);t.notes=cur?cur.notes.map(n=>n.slice()):[];delete t.song;t.notes.push([+d.addnote,view.edBeat||1]);save();render();return}
  if(d.undonote){const t=k.tasks.find(x=>x.id===d.undonote);const cur=songFor(t);if(cur){t.notes=cur.notes.slice(0,-1);delete t.song;save()}render();return}
  if(d.clearnotes){const t=k.tasks.find(x=>x.id===d.clearnotes);t.notes=[];delete t.song;save();render();return}
  if(d.step){const t=k.tasks.find(x=>x.id===d.t);t.times=Math.max(1,Math.min(5,t.times+ +d.step));save();render();return}
  if(d.del){k.tasks=k.tasks.filter(x=>x.id!==d.del);save();render();return}
  if(d.act==='addtask'){k.tasks.push({id:'t'+Date.now(),name:'New song',times:3,focus:'both',done:0,stuck:0});save();render();return}
  if(d.act==='addkid'){const cols=['#7FB7E6','#F07C8E','#E3A62F','#2E6B57'];S.kids.push({id:'k'+Date.now(),name:'New kid',color:cols[S.kids.length%4],fish:0,stars:0,owned:[],wearing:[],fed:0,streak:[0,0,0,0,0,0,0],tasks:[],log:[],minutes:0,worksheet:null});save();render();return}
  if(d.act==='sound'){S.sound=!S.sound;save();render();return}
  if(d.act==='reset'){const g=view.gate;S=sample();save();view={tab:'parent',gate:g};render();return}
});
document.getElementById('kitty-tap-guard');
document.addEventListener('pointerdown',e=>{if(e.target.closest('#kitty')&&view.tab==='kitty'){hearts(3);say('Purrrr…','happy');const s=$('.speech');if(s)s.textContent='Purrrr…';const m=document.getElementById('kitty');m.innerHTML=kittySVG({mood:'happy',wear:kid().wearing})}});
document.addEventListener('change',e=>{
  const d=e.target.dataset,k=kid();
  if(d.name){k.tasks.find(t=>t.id===d.name).name=e.target.value.trim()||'Song';save();renderTop()}
  if(d.focus){k.tasks.find(t=>t.id===d.focus).focus=e.target.value;save()}
  if(d.apikey){const v=e.target.value.trim();if(v&&!v.startsWith('••')){S.apiKey=v;save();render()}else if(!v){S.apiKey='';save();render()}return}
  if(d.kname){S.kids.find(x=>x.id===d.kname).name=e.target.value.trim()||'Kid';S.sample=false;save();renderTop()}
  if(e.target.id==='feed'&&e.target.files[0]){feedKitty(e.target.files[0]);e.target.value=''}
});
render();
